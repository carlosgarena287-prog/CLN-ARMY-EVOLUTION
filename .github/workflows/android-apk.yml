
name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Download Godot 4.7.2
        run: |
          VERSION="4.7.2"
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v${VERSION}-stable_linux.x86_64
          echo "$PWD/godot-bin" >> "$GITHUB_PATH"

      - name: Download export templates
        run: |
          VERSION="4.7.2"
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          unzip -q templates.tpz -d templates-unpacked
          cp -r templates-unpacked/templates/* "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"

      - name: Import project
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export APK
        run: |
          mkdir -p build
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/CLN-Army-Evolution.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CLN-Army-Evolution-Android
          path: build/CLN-Army-Evolution.apk
          if-no-files-found: error
          retention-days: 14
