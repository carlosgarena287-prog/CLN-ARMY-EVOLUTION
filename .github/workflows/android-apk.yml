
name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "Usando: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.7.2"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip -d godot-bin

          chmod +x godot-bin/Godot_v${VERSION}-stable_linux.x86_64

      - name: Download export templates
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.7.2"

          wget -q \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" \
            -O templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"

          unzip -q templates.tpz -d templates-unpacked

          cp -r templates-unpacked/templates/* \
            "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail

          godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-debug "Android" \
            build/CLN-Army-Evolution.apk

          test -s build/CLN-Army-Evolution.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CLN-Army-Evolution-Android
          path: build/CLN-Army-Evolution.apk
          if-no-files-found: error
          retention-days: 14
          
